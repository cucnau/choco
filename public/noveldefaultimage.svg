<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bookCoverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241322"/>
      <stop offset="35%" stop-color="#3b1d33"/>
      <stop offset="70%" stop-color="#2a1425"/>
      <stop offset="100%" stop-color="#190a16"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f3ede2"/>
    </linearGradient>
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="4%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="8%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Nền bìa sách da lụa cao cấp -->
  <rect width="300" height="420" rx="4" fill="url(#bookCoverBg)"/>

  <!-- Gáy sách giả lập ánh sáng 3D -->
  <rect x="0" y="0" width="24" height="420" fill="url(#spineShadow)"/>
  <line x1="24" y1="0" x2="24" y2="420" stroke="#fef08a" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Khung viền chỉ vàng hoàng gia -->
  <rect x="36" y="24" width="238" height="372" rx="4" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" stroke-opacity="0.65"/>
  <rect x="41" y="29" width="228" height="362" rx="2" fill="none" stroke="url(#goldGradient)" stroke-width="0.6" stroke-opacity="0.35" stroke-dasharray="4 2"/>

  <!-- Họa tiết 4 góc cổ điển -->
  <!-- Góc trên trái -->
  <path d="M 46 34 L 58 34 M 46 34 L 46 46" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
  <circle cx="49" cy="37" r="1.5" fill="#fde047"/>
  <!-- Góc trên phải -->
  <path d="M 264 34 L 252 34 M 264 34 L 264 46" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
  <circle cx="261" cy="37" r="1.5" fill="#fde047"/>
  <!-- Góc dưới trái -->
  <path d="M 46 386 L 58 386 M 46 386 L 46 374" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
  <circle cx="49" cy="383" r="1.5" fill="#fde047"/>
  <!-- Góc dưới phải -->
  <path d="M 264 386 L 252 386 M 264 386 L 264 374" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
  <circle cx="261" cy="383" r="1.5" fill="#fde047"/>

  <!-- Thẻ danh đề sách (Nhãn giấy Tuyên thành thanh nhã) -->
  <g transform="translate(130, 65)">
    <!-- Bóng mờ nhãn -->
    <rect x="2" y="2" width="56" height="230" rx="3" fill="#000000" fill-opacity="0.35"/>
    <!-- Nền nhãn giấy trắng ngà -->
    <rect x="0" y="0" width="56" height="230" rx="3" fill="url(#paperBg)" stroke="#ca8a04" stroke-width="0.8"/>
    <!-- Khung viền đỏ son phong cách cổ bản -->
    <rect x="4" y="4" width="48" height="222" rx="1" fill="none" stroke="#991b1b" stroke-width="0.8" stroke-opacity="0.75"/>

    <!-- Chữ đề sách dọc theo phong cách cổ điển -->
    <text x="28" y="45" font-family="'Noto Serif SC', 'SimSun', 'Songti SC', serif" font-size="20" font-weight="900" fill="#1c1917" text-anchor="middle" letter-spacing="4">
      <tspan x="28" dy="0">晉</tspan>
      <tspan x="28" dy="32">江</tspan>
      <tspan x="28" dy="32">文</tspan>
      <tspan x="28" dy="32">學</tspan>
    </text>

    <!-- Dấu ấn triện son đỏ nghệ thuật -->
    <g transform="translate(14, 168)">
      <rect width="28" height="28" rx="3" fill="#dc2626" fill-opacity="0.9"/>
      <rect x="2" y="2" width="24" height="24" rx="2" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.85"/>
      <text x="14" y="19" font-family="'Noto Serif SC', serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">藏</text>
    </g>
  </g>

  <!-- Họa tiết hoa văn mây sóng nguyệt sắc chìm mờ ảo -->
  <path d="M 60 320 Q 90 300 120 325 T 180 325 T 240 320" fill="none" stroke="url(#goldGradient)" stroke-width="0.8" stroke-opacity="0.25"/>
  <path d="M 75 332 Q 105 312 135 337 T 195 337 T 235 332" fill="none" stroke="url(#goldGradient)" stroke-width="0.6" stroke-opacity="0.18"/>

  <!-- Dòng chữ phụ đề phong cách xuất bản văn học tinh tế -->
  <text x="155" y="360" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="3" opacity="0.85">DANMEI LITERATURE</text>
</svg>
